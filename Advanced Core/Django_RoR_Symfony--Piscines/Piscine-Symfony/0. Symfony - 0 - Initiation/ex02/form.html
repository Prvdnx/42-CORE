<!-- This file implements a simple HTML form that integrates an external JavaScript file. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
</head>

<body>
    <h1>Contact Form</h1>
    <form>
        <div>
            <label for="firstname">Firstname:</label>
            <input type="text" id="firstname" name="firstname">
        </div>
        <div>
            <label for="lastname">Name:</label>
            <input type="text" id="lastname" name="lastname">
        </div>
        <div>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age">
        </div>
        <div>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone">
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </div>
        <div>
            <label for="is_student">Student at 42?:</label>
            <input type="checkbox" id="is_student" name="is_student">
        </div>
        <div>
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="Male"> <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female"> <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="Other"> <label for="other">Other</label>
        </div>
        <button type="button" onclick="displayFormContents()">Submit</button>
    </form>

    <script src="popup.js"></script>
</body>

</html>
