<!-- This file is a replication of a target webpage, demonstrating the use of HTML and CSS for layout. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Skills Progress</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>Skills</h2>
    <ul>
        <li>
            <p data-value="95">HTML5</p>
            <progress value="95" max="100" class="html5"></progress>
        </li>
        <li>
            <p data-value="90">Python</p>
            <progress value="90" max="100" class="python"></progress>
        </li>
        <li>
            <p data-value="85">CSS3</p>
            <progress value="85" max="100" class="css3"></progress>
        </li>
        <li>
            <p data-value="75">PHP</p>
            <progress value="75" max="100" class="php"></progress>
        </li>
        <li>
            <p data-value="60">jQuery</p>
            <progress value="60" max="100" class="jquery"></progress>
        </li>
        <li>
            <p data-value="50">Node.js</p>
            <progress value="50" max="100" class="node-js"></progress>
        </li>
    </ul>
</body>

</html>
